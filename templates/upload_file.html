<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wafer Fault Detection</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #f8fafc;
    }

    .container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    .title h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .title p {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .dropzone {
      position: relative;
      border: 2px dashed #3b82f6;
      border-radius: 12px;
      padding: 35px 20px;
      background: rgba(59, 130, 246, 0.03);
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .dropzone:hover {
      background: rgba(59, 130, 246, 0.08);
      border-color: #60a5fa;
      transform: translateY(-2px);
    }

    .upload-icon {
      font-size: 42px;
      color: #3b82f6;
    }

    .dropzone span {
      font-size: 14px;
      color: #cbd5e1;
    }

    .upload-input {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .file-name {
      font-size: 13px;
      color: #38bdf8;
      margin-top: 5px;
      font-weight: 500;
      word-break: break-all;
    }

    .btn {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="container">
    <form action="/predict" method="post" enctype="multipart/form-data">
      <div class="title">
        <h1>Wafer Fault Detection</h1>
        <p>Upload a CSV file to run fault predictions</p>
      </div>

      <div class="dropzone">
        <i class="fa-solid fa-cloud-arrow-up upload-icon"></i>
        <span>Drag & Drop CSV or <strong>Browse</strong></span>
        <div class="file-name" id="fileNameDisplay"></div>
        <input type="file" class="upload-input" id="fileInput" name="file" accept=".csv" required>
      </div>

      <button type="submit" class="btn" name="uploadbutton">
        Start Prediction
      </button>
    </form>
  </div>

  <script>
    // File select hone par file name show karne ke liye JavaScript
    const fileInput = document.getElementById('fileInput');
    const fileNameDisplay = document.getElementById('fileNameDisplay');

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        fileNameDisplay.textContent = `Selected: ${e.target.files[0].name}`;
      } else {
        fileNameDisplay.textContent = '';
      }
    });
  </script>
</body>
</html>
